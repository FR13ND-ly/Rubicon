[package]
name = "rubicon"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "=0.8.9"
deno_core = "=0.412.0"
deno_web = "=0.290.0"
deno_webidl = "=0.259.0"
tokio = { version = "=1.53.2", features = ["rt", "macros", "rt-multi-thread", "net", "sync", "time"] }
serde = { version = "=1.0.229", features = ["derive"] }

[[test]]
name = "renderer_errors"
path = "tests/renderer_errors.rs"
harness = false