[package]
name = "rubicon"
version = "0.1.0"
edition = "2024"

[features]
default = []
render-timing = [
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:tracing-appender",
]

[dependencies]
axum = "=0.8.9"
deno_core = "=0.412.0"
deno_web = "=0.290.0"
deno_webidl = "=0.259.0"
deno_fetch = "=0.283.0"
deno_net = "=0.251.0"
tokio = { version = "=1.53.2", features = ["rt", "macros", "rt-multi-thread", "net", "sync", "time"] }
serde = { version = "=1.0.229", features = ["derive"] }
tower-http = { version = "=0.7.1", features = ["fs"] }
tracing = { version = "=0.1.44", optional = true }
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "std"], optional = true }
tracing-appender = { version = "=0.2.5", default-features = false, optional = true }

[[test]]
name = "renderer_errors"
path = "tests/renderer_errors.rs"
harness = false