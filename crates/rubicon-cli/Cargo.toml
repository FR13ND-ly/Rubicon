[package]
name = "rubicon-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "=4.6.5", features = ["derive"] }
serde = { version = "=1.0.229", features = ["derive"] }
tokio = { version = "=1.53.2", features = ["macros", "rt", "process", "signal", "sync", "time"] }
toml = "=1.1.8"
url = "=2.5.8"

[[bin]]
name = "rb"
path = "src/main.rs"