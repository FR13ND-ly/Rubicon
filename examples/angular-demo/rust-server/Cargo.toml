[package]
name = "rubicon-demo-server"
version = "0.1.0"
edition = "2024"

[features]
default = []
render-timing = [
    "rubicon/render-timing",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:tracing-appender",
]

[dependencies]
rubicon = { path = "../../../crates/rubicon" }

axum = "=0.8.9"
deno_core = "=0.412.0"
tokio = { version = "=1.53.2", features = ["macros", "rt-multi-thread", "signal"] }
serde = { version = "=1.0.229", features = ["derive"] }

tracing = { version = "=0.1.44", optional = true }
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "std"], optional = true }
tracing-appender = { version = "=0.2.5", default-features = false, optional = true }